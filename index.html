<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Плай — оцінка прокату</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #17324d 0%,
          #0b1d2d 42%,
          #06111c 100%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px 18px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    /* =========================
       ЛОГОТИП
       ========================= */

    .logo-circle {
      width: 160px;
      height: 160px;

      margin: 0 auto 32px;

      background: #ffffff;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .logo-circle img {
      width: 92%;
      height: 92%;

      object-fit: contain;
      object-position: center;

      display: block;

      margin: auto;
    }

    /* =========================
       ЗАГОЛОВОК
       ========================= */

    h1 {
      font-size: 34px;
      line-height: 1.15;
      font-weight: 750;

      max-width: 560px;

      margin: 0 auto 12px;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.45;

      color: rgba(255, 255, 255, 0.68);

      margin-bottom: 38px;
    }

    /* =========================
       БЛОК ОЦІНКИ
       ========================= */

    .rating-card {
      background: rgba(255, 255, 255, 0.07);

      border:
        1px solid rgba(255, 255, 255, 0.10);

      border-radius: 26px;

      padding: 24px 14px 20px;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.18);
    }

    .rating-title {
      font-size: 15px;

      color: rgba(255, 255, 255, 0.72);

      margin-bottom: 22px;
    }

    .ratings {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 8px;
    }

    .rating {
      border: none;

      background: transparent;

      color: white;

      cursor: pointer;

      padding: 8px 2px 10px;

      border-radius: 18px;

      transition:
        transform 0.18s ease,
        background 0.18s ease;

      -webkit-tap-highlight-color:
        transparent;
    }

    .rating:hover {
      background:
        rgba(255, 255, 255, 0.08);

      transform:
        translateY(-3px);
    }

    .rating:active {
      transform:
        scale(0.94);
    }

    .emoji {
      display: block;

      font-size: 48px;
      line-height: 1;

      margin-bottom: 11px;
    }

    .label {
      display: block;

      font-size: 12px;
      line-height: 1.2;

      color:
        rgba(255, 255, 255, 0.78);
    }

    .number {
      display: block;

      margin-top: 6px;

      font-size: 11px;
      font-weight: 700;

      color:
        rgba(255, 255, 255, 0.35);
    }

    /* =========================
       МОБІЛЬНА ВЕРСІЯ
       ========================= */

    @media (max-width: 500px) {

      body {
        padding:
          max(24px, env(safe-area-inset-top))
          12px
          max(24px, env(safe-area-inset-bottom));
      }

      .logo-circle {
        width: 150px;
        height: 150px;

        margin-bottom: 30px;
      }

      .logo-circle img {
        width: 92%;
        height: 92%;
      }

      h1 {
        font-size: 29px;
      }

      .subtitle {
        font-size: 16px;

        margin-bottom: 30px;
      }

      .rating-card {
        padding:
          22px 6px 18px;

        border-radius: 24px;
      }

      .ratings {
        gap: 2px;
      }

      .emoji {
        font-size: 42px;
      }

      .label {
        font-size: 10px;
      }

      .number {
        font-size: 10px;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <!-- ЛОГОТИП ПЛАЙ -->

    <div class="logo-circle">
      <img
        src="./logo.png"
        alt="Плай"
      >
    </div>


    <!-- ЗАГОЛОВОК -->

    <h1>
      Як пройшла ваша оренда спорядження?
    </h1>

    <p class="subtitle">
      Оберіть оцінку — це займе лише кілька секунд
    </p>


    <!-- ОЦІНКА -->

    <section class="rating-card">

      <div class="rating-title">
        Оцініть ваші враження
      </div>

      <div class="ratings">

        <button
          class="rating"
          type="button"
          onclick="selectRating(1)"
        >
          <span class="emoji">😡</span>

          <span class="label">
            Дуже<br>погано
          </span>

          <span class="number">
            1
          </span>
        </button>


        <button
          class="rating"
          type="button"
          onclick="selectRating(2)"
        >
          <span class="emoji">🙁</span>

          <span class="label">
            Погано
          </span>

          <span class="number">
            2
          </span>
        </button>


        <button
          class="rating"
          type="button"
          onclick="selectRating(3)"
        >
          <span class="emoji">😐</span>

          <span class="label">
            Нормально
          </span>

          <span class="number">
            3
          </span>
        </button>


        <button
          class="rating"
          type="button"
          onclick="selectRating(4)"
        >
          <span class="emoji">🙂</span>

          <span class="label">
            Добре
          </span>

          <span class="number">
            4
          </span>
        </button>


        <button
          class="rating"
          type="button"
          onclick="selectRating(5)"
        >
          <span class="emoji">😍</span>

          <span class="label">
            Чудово
          </span>

          <span class="number">
            5
          </span>
        </button>

      </div>

    </section>

  </main>


  <script>

    /*
      Отримуємо код конкретної каси
      з QR-посилання.

      Наприклад:

      ?desk=P1-T01
    */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const desk =
      params.get("desk") || "";


    function selectRating(rating) {

      console.log(
        "Каса:",
        desk
      );

      console.log(
        "Оцінка:",
        rating
      );

      /*
        На наступному етапі сюди
        підключимо передачу:

        - оцінки 1–5;
        - коду каси;
        - Session ID;
        - часу;
        - даних у Google Sheets.
      */

    }

  </script>

</body>
</html>
